# Render Blueprint: New > Blueprint > pick this repo. Deploys the API on the free plan.
services:
  - type: web
    name: training-estimate-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # The API refuses to serve estimates without a key, so this must stay.
      - key: API_KEY
        generateValue: true
      # Costs above this need a second approval. Keep the Dataverse business rule in step
      # (dataverse/schema.md, "The $1,000 threshold").
      - key: HIGH_COST_THRESHOLD
        value: "1000"
