name: App source CI

on:
  push:
    paths: ["powerapps/source/**", "ruff.toml", ".github/workflows/app-source-ci.yml"]
  pull_request:
    paths: ["powerapps/source/**", "ruff.toml", ".github/workflows/app-source-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powerapps/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: powerapps/source/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Fails if the committed screens are stale, reference something that doesn't exist,
      # use an unknown property, or draw two controls on top of each other.
      - run: pytest -q
