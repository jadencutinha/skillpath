name: API CI

on:
  push:
    paths: ["api/**", "connector/apiDefinition.swagger.json", "ruff.toml", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["api/**", "connector/apiDefinition.swagger.json", "ruff.toml", ".github/workflows/api-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Includes the contract tests that compare the connector's Swagger file with the API,
      # which is why a change to the Swagger file also triggers this workflow.
      - run: pytest -q
