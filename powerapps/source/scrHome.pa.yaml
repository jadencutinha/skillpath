                        FocusedBorderColor: =fxTheme.Primary
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        HoverBorderColor: =fxTheme.Border
                        HoverColor: =fxTheme.Danger
                        HoverFill: =fxTheme.DangerTint
                        OnSelect: |-
                          =IfError(
                              Patch('Training Requests', galMyRequests.Selected, { 'Requested Action': fxAction.Withdraw });
                              Set(varPollTicks, 0);
                              Set(varPolling, true);
                              Notify("Request withdrawn.", NotificationType.Success),
                              Notify("Could not withdraw: " & FirstError.Message, NotificationType.Error)
                          )
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =0
                        PressedBorderColor: =fxTheme.Border
                        PressedColor: =fxTheme.Danger
                        PressedFill: =fxTheme.DangerTint
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =10.5
                        Text: =If(galMyRequests.Selected.'Request Status' = fxStatus.Draft, "Discard", "Withdraw request")
                        Visible: =IsBlank(galMyRequests.Selected.'Requested Action') && (galMyRequests.Selected.'Request Status' = fxStatus.Draft || galMyRequests.Selected.'Request Status' = fxStatus.Submitted)
                        Width: =165
                        X: =If(galMyRequests.Selected.'Request Status' <> fxStatus.Submitted, 197, 20)
                        Y: =434
            - lblDetailEmpty:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderThickness: =0
                  Color: =fxTheme.Subtle
                  FocusedBorderThickness: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Normal
                  Height: =40
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =10.5
                  Text: ="Select a request to see where it stands."
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =IsBlank(galMyRequests.Selected)
                  Width: =322
                  Wrap: =true
                  X: =30
                  Y: =210
      - tmrPoll:
          Control: Timer
          Properties:
            AutoStart: =false
            Duration: =4000
            OnTimerEnd: |-
              =Refresh('Training Requests');
              Set(varPollTicks, varPollTicks + 1);
              // Stop once every command has been handled, or after a minute if a flow is down.
              If(
                  varPollTicks >= 15
                      || IsEmpty(Filter(galMyRequests.AllItems, !IsBlank('Requested Action'))),
                  Set(varPolling, false)
              )
            Repeat: =varPolling
            Start: =varPolling
            Visible: =false
            X: =0
            Y: =0
