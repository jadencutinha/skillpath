                        HoverFill: =fxTheme.PrimaryHover
                        OnSelect: |-
                          =Switch(
                              galMyRequests.Selected.'Request Status',
                              fxStatus.Draft,
                                  Set(varEditRequest, galMyRequests.Selected);
                                  Set(varCourse, LookUp('Training Courses', 'Training Course' = galMyRequests.Selected.Course.'Training Course'));
                                  Navigate(scrNewRequest, ScreenTransition.Cover),
                              fxStatus.Approved,
                                  IfError(
                                      Patch('Training Requests', galMyRequests.Selected, { 'Requested Action': fxAction.Complete });
                                      Set(varPollTicks, 0);
                                      Set(varPolling, true);
                                      Notify("Marked as completed.", NotificationType.Success),
                                      Notify("Could not update: " & FirstError.Message, NotificationType.Error)
                                  ),
                              // A finished request can't be reopened, so start a new one for the same course.
                              // The LookUp returns blank if the course has since been retired from the catalog.
                              Set(varEditRequest, Blank());
                              Set(
                                  varCourse,
                                  LookUp('Training Courses', 'Training Course' = galMyRequests.Selected.Course.'Training Course' && Active = true)
                              );
                              If(
                                  IsBlank(varCourse),
                                  Notify("That course is no longer offered. Pick another from the catalog.", NotificationType.Warning);
                                  Navigate(scrCatalog, ScreenTransition.Fade),
                                  Navigate(scrNewRequest, ScreenTransition.Cover)
                              )
