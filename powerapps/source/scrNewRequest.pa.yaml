                  RadiusTopRight: =8
                  Size: =10.5
                  Text: ="Save as draft"
                  Width: =140
                  X: =226
                  Y: =570
            - btnCancel:
                Control: Classic/Button
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  Color: =fxTheme.Muted
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =fxTheme.White
                  DisabledFill: =fxTheme.Disabled
                  Fill: =fxTheme.Canvas
                  FocusedBorderColor: =fxTheme.Primary
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =40
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =fxTheme.Muted
                  HoverFill: =fxTheme.Border
                  OnSelect: |-
                    =Set(varEditRequest, Blank());
                    Navigate(scrHome, ScreenTransition.Fade)
                  PaddingBottom: =0
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =0
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =fxTheme.Muted
                  PressedFill: =fxTheme.Border
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =10.5
                  Text: ="Cancel"
                  Width: =100
                  X: =536
                  Y: =570
            - btnSave:
                Control: Classic/Button
                Properties:
                  Height: =10
                  OnSelect: |-
                    =// One formula for both buttons: varSubmitIntent says whether to send the Submit command.
                    // The app writes these four columns and no others; status, cost and approver belong to the flows.
                    IfError(
                        If(
                            IsBlank(varEditRequest),
                            Patch(
                                'Training Requests',
                                Defaults('Training Requests'),
                                {
                                    Title: Trim(txtTitle.Text),
                                    Course: varCourse,
                                    Justification: Trim(txtJustification.Text),
                                    'Requested Action': If(varSubmitIntent, fxAction.Submit, Blank())
                                }
                            ),
                            // Course is deliberately absent: it can't be changed once the draft exists.
                            Patch(
                                'Training Requests',
                                varEditRequest,
                                {
                                    Title: Trim(txtTitle.Text),
                                    Justification: Trim(txtJustification.Text),
                                    'Requested Action': If(varSubmitIntent, fxAction.Submit, Blank())
                                }
                            )
                        );
                        Notify(If(varSubmitIntent, "Request sent for approval.", "Draft saved."), NotificationType.Success);
                        Set(varPollTicks, 0);
                        Set(varPolling, varSubmitIntent);
                        Set(varEditRequest, Blank());
                        Navigate(scrHome, ScreenTransition.Fade),
                        Notify("Could not save: " & FirstError.Message, NotificationType.Error)
                    )
                  Visible: =false
                  Width: =10
                  X: =0
                  Y: =0
            - btnRefreshEstimate:
                Control: Classic/Button
                Properties:
                  Height: =10
                  OnSelect: |-
                    =IfError(
                        Set(varEstimate, TrainingEstimate.GetEstimate(varCourse.Cost, varCourse.Hours)),
                        Set(varEstimate, Blank())
                    );
                    // The API owns the threshold. Fall back to the local constant only when it didn't answer.
                    Set(varThreshold, Coalesce(varEstimate.high_cost_threshold, fxFallbackThreshold))
                  Visible: =false
                  Width: =10
                  X: =0
                  Y: =0
